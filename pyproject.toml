[project]
name = "psa-code-sprint"
version = "0.1.0"
description = "PSA Code Sprint 2.0 transshipment recovery backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "sqlmodel>=0.0.24,<0.1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
addopts = ["-p", "no:cacheprovider"]
testpaths = ["backend/tests"]
pythonpath = ["."]
